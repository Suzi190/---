name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 发布 Release 需要写权限，不加这一步会 403
permissions:
  contents: write

jobs:
  build:
    name: 打包 叉叉机 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "runner 自带的 Android SDK: $SDK"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "镜像没有预装 SDK，改为手动下载 cmdline-tools"
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMGR" ]; then
            echo "::error::找不到 sdkmanager，无法继续"
            exit 1
          fi
          echo "sdkmanager: $SDKMGR"
          echo "当前 java: $(java -version 2>&1 | head -n 1)"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -n 5
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms" "$SDK/build-tools" 2>/dev/null || true

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('capacitor.config.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 安装 npm 依赖
        run: npm install --no-audit --no-fund --include=dev

      - name: 生成 www 目录（只打包要用的文件）
        run: node scripts/build-www.js

      - name: 生成 Android 工程
        run: npx cap add android

      - name: 打 Android 补丁（全屏 / 键盘 / 通知 / 插件 / 图标）
        run: node scripts/patch-android.js

      - name: 同步 Web 资源到 Android
        run: npx cap sync android

      - name: 编译 Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 检查产物并准备两种打包形式
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          # 很多手机浏览器 / 杀软会把 zip 里的 .apk 直接判成病毒，连 zip 都不让下。
          # 下面这个副本只改了后缀，下载完把 .txt 去掉就是正常的安装包。
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/chachaji.apk.txt
          ls -lh dist

      - name: 上传 APK（标准版）
        uses: actions/upload-artifact@v4
        with:
          name: chachaji-apk
          path: dist/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传 APK（手机被拦时用这个）
        uses: actions/upload-artifact@v4
        with:
          name: chachaji-apk-rename-to-apk
          path: dist/chachaji.apk.txt
          if-no-files-found: error
          retention-days: 30

      # Artifact 下载必须登录 GitHub，手机上下不了。
      # Release 是公开直链，手机浏览器点开就能下，这里同时放两种后缀各一份。
      - name: 发布到 Release（手机点开直接下）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest > /dev/null 2>&1; then
            echo "Release 'latest' 已存在，直接覆盖其中的安装包"
          else
            gh release create latest \
              --title "叉叉机 APK（最新构建）" \
              --notes "手机下载 chachaji.apk.txt，然后把文件名末尾的 .txt 去掉，就得到可以安装的 APK。"
          fi
          gh release upload latest dist/chachaji.apk.txt --clobber
          gh release upload latest dist/app-debug.apk --clobber
          echo "下载页: $(gh release view latest --json url --jq .url)"
