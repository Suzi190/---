name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: 打包 叉叉机 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('capacitor.config.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 安装 npm 依赖
        run: npm install --no-audit --no-fund

      - name: 生成 www 目录（只打包要用的文件）
        run: node scripts/build-www.js

      - name: 生成 Android 工程
        run: npx cap add android

      - name: 打 Android 补丁（全屏 / 键盘 / 通知 / 插件 / 图标）
        run: node scripts/patch-android.js

      - name: 同步 Web 资源到 Android
        run: npx cap sync android

      - name: 编译 Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 检查产物
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: chachaji-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
